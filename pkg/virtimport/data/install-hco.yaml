apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    import.kubevirt.io/virt-import-version: latest
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: virt-import
    control-plane: controller-manager
    kubevirt.io: virt-import-controller
  name: virt-import-controller
  namespace: kubevirt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: virt-import
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        import.kubevirt.io/virt-import-version: latest
        kubectl.kubernetes.io/default-container: manager
        openshift.io/required-scc: restricted-v2
      labels:
        app.kubernetes.io/name: virt-import
        control-plane: controller-manager
        np.kubevirt.io/allow-access-cluster-services: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - arm64
                - s390x
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      automountServiceAccountToken: true
      containers:
      - args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /manager
        env:
        - name: FETCHER_IMAGE
          value: quay.io/kubevirt/virt-import-fetcher:latest
        image: quay.io/kubevirt/virt-import-controller:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8443
          name: http-metrics
          protocol: TCP
        - containerPort: 8081
          name: http-healthz
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 15
          httpGet:
            path: /healthz
            port: 8081
          periodSeconds: 5
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts: []
      priorityClassName: kubevirt-cluster-critical
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: virt-import-controller-manager
      terminationGracePeriodSeconds: 10
      volumes: []
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  annotations:
    import.kubevirt.io/virt-import-version: latest
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: virt-import
    kubevirt.io: virt-import-vmimport-authz
  name: virt-import-vmimport-authz
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - import.kubevirt.io
      apiVersions:
      - v1alpha1
      operations:
      - CREATE
      resources:
      - virtualmachineimports
  validations:
  - expression: authorizer.group('cdi.kubevirt.io').resource('datavolumes').namespace(variables.targetNS).check('create').allowed()
    messageExpression: '''User is not allowed to create DataVolumes in namespace ''
      + variables.targetNS'
    reason: Forbidden
  - expression: authorizer.group('kubevirt.io').resource('virtualmachines').namespace(variables.targetNS).check('create').allowed()
    messageExpression: '''User is not allowed to create VirtualMachines in namespace
      '' + variables.targetNS'
    reason: Forbidden
  - expression: authorizer.group('template.kubevirt.io').resource('virtualmachinetemplates').namespace(variables.targetNS).check('create').allowed()
    messageExpression: '''User is not allowed to create VirtualMachineTemplates in
      namespace '' + variables.targetNS'
    reason: Forbidden
  variables:
  - expression: object.metadata.namespace
    name: targetNS
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  annotations:
    import.kubevirt.io/virt-import-version: latest
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: virt-import
    kubevirt.io: virt-import-vmimport-authz
  name: virt-import-vmimport-authz
spec:
  policyName: virt-import-vmimport-authz
  validationActions:
  - Deny
